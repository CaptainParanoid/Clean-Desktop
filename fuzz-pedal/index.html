<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>VOLT — Germanium Fuzz</title>
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%231e1814'/%3E%3Ccircle cx='16' cy='16' r='6' fill='%23ffb347'/%3E%3C/svg%3E"
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=IBM+Plex+Mono:wght@400;500&family=Syne:wght@500;700;800&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="atmosphere" aria-hidden="true">
      <div class="grain"></div>
      <div class="wash"></div>
    </div>

    <main class="stage">
      <header class="brand-block">
        <p class="eyebrow">Boutique fuzz · est. 1969</p>
        <h1 class="brand">VOLT</h1>
        <p class="tagline">Asymmetric germanium grit for guitars that refuse to behave.</p>
      </header>

      <section class="pedal" aria-label="VOLT fuzz pedal controls">
        <div class="pedal-chassis">
          <div class="pedal-screw pedal-screw--tl" aria-hidden="true"></div>
          <div class="pedal-screw pedal-screw--tr" aria-hidden="true"></div>
          <div class="pedal-screw pedal-screw--bl" aria-hidden="true"></div>
          <div class="pedal-screw pedal-screw--br" aria-hidden="true"></div>

          <div class="led-row">
            <span class="led" id="statusLed" data-on="false" aria-hidden="true"></span>
            <span class="led-label" id="statusLabel">bypass</span>
          </div>

          <div class="knob-row">
            <label class="knob" data-control="fuzz">
              <span class="knob-face">
                <span class="knob-pointer"></span>
              </span>
              <input
                type="range"
                id="fuzz"
                min="0"
                max="100"
                value="72"
                aria-label="Fuzz amount"
              />
              <span class="knob-name">fuzz</span>
              <span class="knob-value" data-for="fuzz">72</span>
            </label>

            <label class="knob" data-control="tone">
              <span class="knob-face">
                <span class="knob-pointer"></span>
              </span>
              <input
                type="range"
                id="tone"
                min="0"
                max="100"
                value="48"
                aria-label="Tone"
              />
              <span class="knob-name">tone</span>
              <span class="knob-value" data-for="tone">48</span>
            </label>

            <label class="knob" data-control="level">
              <span class="knob-face">
                <span class="knob-pointer"></span>
              </span>
              <input
                type="range"
                id="level"
                min="0"
                max="100"
                value="55"
                aria-label="Output level"
              />
              <span class="knob-name">level</span>
              <span class="knob-value" data-for="level">55</span>
            </label>
          </div>

          <button type="button" class="footswitch" id="engageBtn" aria-pressed="false">
            <span class="footswitch-cap"></span>
            <span class="footswitch-label">engage</span>
          </button>

          <p class="badge">Si / Ge hybrid · 9V</p>
        </div>
      </section>

      <section class="controls" aria-label="Input source">
        <div class="device-row">
          <label class="device-label" for="inputDevice">
            Guitar / interface input
            <select id="inputDevice" class="device-select">
              <option value="">Default system input</option>
            </select>
          </label>
        </div>
        <div class="control-group">
          <button type="button" class="btn btn-primary" id="demoBtn">
            Play demo riff
          </button>
          <button type="button" class="btn" id="micBtn">
            Enable guitar input
          </button>
          <label class="btn file-btn">
            Load audio
            <input type="file" id="fileInput" accept="audio/*" hidden />
          </label>
        </div>
        <p class="hint" id="hint">
          Plug guitar → interface → pick that device below → Enable guitar input → Engage.
        </p>
      </section>
    </main>

    <script type="module" src="app.js"></script>
  </body>
</html>
